version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ticketing-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-ticketing_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ticketing_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticketing-api
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-ticketing_db}
      DB_SSL_MODE: disable
      JWT_SECRET: ${JWT_SECRET:-enterprise-production-super-secret-key-32b}
      GIT_WEBHOOK_SECRET: ${GIT_WEBHOOK_SECRET:-demo-webhook-secret}
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads

  seed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticketing-seed
    entrypoint: ["/app/seed"]
    profiles: ["seed"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-ticketing_db}
      DB_SSL_MODE: disable

volumes:
  pgdata:
  uploads_data:

